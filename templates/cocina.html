<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocina - Pedidos Pendientes - Cafetería IGJ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="max-width: 1000px; margin: 0 auto; padding: 40px 20px;">

    <div class="header-cocina">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='gaus-1.png') }}" alt="Logo Universidad Gauss Jordan" class="logo-img">
        </div>
        <h1>Pantalla de Cocina</h1>
        <div class="badge-cola">Pedidos en cola: {{ cantidad }}</div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Producto</th>
                    <th>Acción</th>
                </tr>
            </thead>

            <tbody id="cuerpo-tabla-cocina">
                {% for pedido in pedidos %}
                <tr>
                    <td>#{{ pedido[0] }}</td>
                    <td>{{ pedido[1] }}</td>
                    <td>{{ pedido[2] }}</td>
                    <td>
                        <form action="/pedido_listo/{{ pedido[0] }}" method="post">
                            <button type="submit" class="btn btn-success" style="padding: 8px 16px; font-size: 0.9rem;">Listo ✔</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}

                {% if cantidad == 0 %}
                <tr>
                    <td colspan="4" style="padding: 30px; color: var(--texto-mutado); font-style: italic;">No hay pedidos pendientes. ¡Buen trabajo!</td>
                </tr>
                {% endif %}
            </tbody>
        </table>
    </div>

    <script>
    async function actualizarCocina() {
        try {
            // Usamos la ruta que creamos anteriormente en app.py
            const respuesta = await fetch('/api/pedidos');
            const pedidos = await respuesta.json();

            // Filtramos solo los pedidos con estado 'Pendiente'
            const pendientes = pedidos.filter(p => p.estado === 'Pendiente');
            
            const tabla = document.getElementById('cuerpo-tabla-cocina');
            const contador = document.querySelector('.badge-cola');

            // 1. Actualizamos el contador de pedidos en el badge
            contador.textContent = 'Pedidos en cola: ' + pendientes.length;

            // 2. Limpiamos las filas viejas de la tabla
            tabla.innerHTML = "";

            if (pendientes.length === 0) {
                tabla.innerHTML = `<tr><td colspan="4" style="padding: 30px; color: var(--texto-mutado); font-style: italic;">No hay pedidos pendientes. ¡Buen trabajo!</td></tr>`;
                return;
            }

            // 3. Insertamos las filas nuevas dinámicamente
            pendientes.forEach(pedido => {
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>#${pedido.id}</td>
                    <td>${pedido.cliente}</td>
                    <td>${pedido.producto}</td>
                    <td>
                        <form action="/pedido_listo/${pedido.id}" method="post">
                            <button type="submit" class="btn btn-success" style="padding: 8px 16px; font-size: 0.9rem;">Listo ✔</button>
                        </form>
                    </td>
                `;
                tabla.appendChild(fila);
            });
        } catch (error) {
            console.error('Error al obtener los pedidos:', error);
        }
    }

    // Actualizar cada 3 segundos para que sea más rápido que antes
    setInterval(actualizarCocina, 3000);
</script>

</body>
</html>
