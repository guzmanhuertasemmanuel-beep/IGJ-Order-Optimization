<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Ventas - Cafetería IGJ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="centered-layout">

    <div class="container">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='gaus-1.png') }}" alt="Logo UGJ" class="logo-img" style="max-width: 130px;">
        </div>
        <h1>Corte de Caja Diario</h1>
        <p class="corte-fecha" style="text-align: center;">Fecha de operaciones: <strong>{{ fecha }}</strong></p>

        <div class="ventas-resumen-card">
            <h3>💵 Pagos en Efectivo</h3>
            <span id="monto-efectivo">${{ "%.2f"|format(total_efectivo) }}</span>
        </div>

        <div class="ventas-resumen-card" style="border-left-color: var(--dorado);">
            <h3>💳 Pagos con Tarjeta</h3>
            <span id="monto-tarjeta">${{ "%.2f"|format(total_tarjeta) }}</span>
        </div>

        <div class="total-final-gradiente" id="monto-total">
            Total Recaudado: ${{ "%.2f"|format(total_dia) }}
        </div>

        <div class="corte-botones-container">
            <a href="/admin" class="btn btn-outline">← Volver al Panel</a>
            <a href="/logout" class="btn btn-accent">Cerrar Sesión</a>
        </div>
    </div>

    <script>
        async function actualizarVentas() {
            try {
                const respuesta = await fetch('/api/ventas');
                
                // Si la sesión expiró o hay un error, nos detenemos
                if (!respuesta.ok) return; 

                const datos = await respuesta.json();

                // Actualizamos los textos usando los IDs, y .toFixed(2) para los decimales
                document.getElementById('monto-efectivo').innerText = `$${datos.efectivo.toFixed(2)}`;
                document.getElementById('monto-tarjeta').innerText = `$${datos.tarjeta.toFixed(2)}`;
                document.getElementById('monto-total').innerText = `Total Recaudado: $${datos.total_dia.toFixed(2)}`;

            } catch (error) {
                console.error("Error al sincronizar ventas:", error);
            }
        }

        // Actualizar cada 5 segundos (5000 ms)
        setInterval(actualizarVentas, 5000);
    </script>
</body>
</html>
