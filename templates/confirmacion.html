<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Confirmado - Cafetería IGJ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        // Redirige automáticamente al inicio después de 5 segundos
        setTimeout(function(){
            window.location.href = "/";
        }, 5000);
    </script>
</head>
<body class="centered-layout">

    <div class="tarjeta-confirmacion">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='gaus-1.png') }}" alt="Logo Universidad Gauss Jordan" class="logo-img">
        </div>
        
        <h1>¡Pedido recibido!</h1>
        <p style="color: var(--texto-secundario); font-size: 1.1rem; margin-bottom: 10px;">Tu orden está siendo procesada en cocina.</p>
        
        <div class="caja-total-confirmacion">
            <h2>Total a pagar: ${{ total }}</h2>
        </div>
        
        <p class="texto-redireccion">Serás redirigido al menú en 5 segundos...</p>
        
        <a href="/" class="btn btn-accent" style="width: 100%; max-width: 250px;">Volver ahora</a>
    </div>

</body>
</html>
