<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo - Cafetería IGJ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="centered-layout">

    <div class="login-caja">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='gaus-1.png') }}" alt="Logo UGJ" class="logo-img" style="max-width: 120px;">
        </div>
        <h2>Acceso Administrativo</h2>
        
        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <input type="password" name="password" placeholder="Contraseña maestra" required>
            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">Entrar</button>
        </form>
        
        <a href="/" class="volver-link">← Volver a la cafetería</a>
    </div>

</body>
</html>
